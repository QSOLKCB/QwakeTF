name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check water routes, round resets, maps and explosive movement
        run: node tools/check-gameplay.mjs
      - name: Check wall visibility and weapon collision
        run: node tools/check-walls.mjs
      - name: Check launcher and embedded assets
        run: node tools/check-launcher.cjs
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/qwaketf-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/qwaketf-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test disk and HTTP startup and gameplay
        run: NODE_PATH="$RUNNER_TEMP/qwaketf-browser/node_modules" node tools/browser-check.cjs
      - name: Retain game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-screenshots
          path: test-results/
          if-no-files-found: ignore
  deploy:
    name: Deploy GitHub Pages
    needs: startup
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game
        run: |
          mkdir _site
          cp index.html style.css LICENSE ASSET_LICENSES.md _site/
          cp -R src assets dist _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
