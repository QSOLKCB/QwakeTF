name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: '1.56.1'
      BROWSER_TOOLS: /home/runner/.cache/qwaketf-browser
      APT_DEBS: /home/runner/.cache/qwaketf-apt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check controller input and fixed-step clock
        run: node tools/check-input.mjs
      - name: Check deterministic simulation parity
        run: node tools/check-parity.mjs
      - name: Check water routes, round resets, maps and explosive movement
        run: node tools/check-gameplay.mjs
      - name: Check wall visibility and weapon collision
        run: node tools/check-walls.mjs
      - name: Check launcher and embedded assets
        run: node tools/check-launcher.cjs
      # OPT-INV-001 invariant-driven reuse, in two caches. These steps are `playwright install --with-deps
      # chromium` split into its parts (apt-get update + install of Playwright's own package list, then the
      # browser download), so each expensive part can be reused when its exact inputs are unchanged.
      # 1. Playwright package + Chromium build: a pure function of runner image, CPU architecture,
      #    Node major and the pinned Playwright version, all of which are in the key.
      - name: Restore browser test dependencies
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BROWSER_TOOLS }}
            ~/.cache/ms-playwright
          key: qwaketf-browser-v1-ubuntu-24.04-${{ runner.arch }}-node22-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright package
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$BROWSER_TOOLS" --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
      # 2. System packages. Run 42315339960 spent 6 min 20 s downloading 21 MB of font .debs from the
      #    Ubuntu mirror. The key is the SHA-256 of the exact archive plan (each .deb filename and its
      #    SHA-256 from the apt index), so a hit restores byte-identical archives. Restored files are
      #    re-checked against the plan, and apt verifies them against its index before installing.
      - name: Plan system packages
        id: apt-plan
        run: |
          key=$(tools/ci-apt-cache.sh plan "$BROWSER_TOOLS/node_modules/.bin/playwright" "$RUNNER_TEMP/apt-plan.txt")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < "$RUNNER_TEMP/apt-plan.txt")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/apt-plan.txt"
      - name: Restore system package archives
        id: apt-cache
        if: steps.apt-plan.outputs.count != '0'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.APT_DEBS }}
          key: qwaketf-apt-v1-ubuntu-24.04-${{ runner.arch }}-${{ steps.apt-plan.outputs.key }}
      - name: Install system packages
        run: tools/ci-apt-cache.sh install "$BROWSER_TOOLS/node_modules/.bin/playwright" "$RUNNER_TEMP/apt-plan.txt" "$APT_DEBS"
      - name: Install browsers
        # On a hit, Playwright skips downloads only when its own install marker is present.
        run: '"$BROWSER_TOOLS/node_modules/.bin/playwright" install chromium'
      - name: Verify browser test dependencies
        run: |
          # Fail closed: a restored tree must be exactly the pinned, consistent install.
          npm ls --prefix "$BROWSER_TOOLS" "playwright@$PLAYWRIGHT_VERSION"
          NODE_PATH="$BROWSER_TOOLS/node_modules" node -e '
            const fs = require("fs"); const pin = process.env.PLAYWRIGHT_VERSION;
            const v = require("playwright/package.json").version;
            if (v !== pin) { console.error(`playwright ${v} does not match pin ${pin}`); process.exit(1); }
            const exe = require("playwright").chromium.executablePath();
            fs.accessSync(exe, fs.constants.X_OK);
            console.log(`playwright ${v}; chromium ${exe}; cache hit: ${process.env.CACHE_HIT || "false"}`);
          '
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
      - name: Verify system package archives
        if: steps.apt-plan.outputs.count != '0' && steps.apt-cache.outputs.cache-hit != 'true'
        run: tools/ci-apt-cache.sh verify "$RUNNER_TEMP/apt-plan.txt" "$APT_DEBS"
      - name: Save system package archives
        if: steps.apt-plan.outputs.count != '0' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APT_DEBS }}
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Save browser test dependencies
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BROWSER_TOOLS }}
            ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Test disk and HTTP startup and gameplay
        run: NODE_PATH="$BROWSER_TOOLS/node_modules" node tools/browser-check.cjs
      - name: Test controller, focus pause and exact render culling
        run: NODE_PATH="$BROWSER_TOOLS/node_modules" node tools/browser-features.cjs
      - name: Retain game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-screenshots
          path: test-results/
          if-no-files-found: ignore
  deploy:
    name: Deploy GitHub Pages
    needs: startup
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game
        run: |
          mkdir _site
          cp index.html style.css LICENSE ASSET_LICENSES.md _site/
          cp -R src assets dist _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
